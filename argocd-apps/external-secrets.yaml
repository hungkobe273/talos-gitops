# External Secrets Operator: copies values from Vault into ordinary Kubernetes Secrets,
# which apps load with envFrom (the ".env" of the app). Git only holds ExternalSecret
# objects ("which keys from which Vault path"), never the values.
# ClusterSecretStore `vault` (Kubernetes auth, read-only policy per app) is in
# platform/external-secrets/manifests, synced after the CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valuesObject:
          installCRDs: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
          webhook:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          certController:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
          serviceMonitor:
            enabled: true
    - repoURL: git@github.com:hungkobe273/talos-gitops.git
      targetRevision: main
      path: platform/external-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      # ESO CRDs are large; client-side apply would overflow the last-applied annotation.
      - ServerSideApply=true
      # ClusterSecretStore is applied in the same sync as the CRD that defines it.
      - SkipDryRunOnMissingResource=true
