# External Secrets Operator: copies values from Vault into ordinary Kubernetes Secrets,
# which apps load with envFrom (the ".env" of the app). Git only holds ExternalSecret
# objects ("which keys from which Vault path"), never the values.
# ClusterSecretStore `vault` (Kubernetes auth, read-only policy per app) is in
# platform/external-secrets/manifests, synced after the CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0
      helm:
        releaseName: external-secrets
        valuesObject:
          installCRDs: true
          # 06/11: talos-core for controller, webhook and cert-controller (platform/admission-policies/priority-core.yaml).
          priorityClassName: talos-core
          resources:
            requests:
              cpu: 10m
              memory: 112Mi    # 29/10: p95 77Mi, max 108Mi
            limits:
              memory: 320Mi    # 03/11: at 83% of 192Mi during cold start, 1 GB re-read from disk
          webhook:
            priorityClassName: talos-core
            resources:
              requests:
                cpu: 10m
                memory: 64Mi   # 29/10: max 43Mi
              limits:
                # 03/11: at 128Mi the binary's page cache was evicted over and over at cold start,
                # 10.7 GB read from the shared HDD in 8 minutes. Limit only; the request is unchanged.
                memory: 256Mi
          certController:
            priorityClassName: talos-core
            # Default 5m: at cold start /readyz only turned green at the second pass, 6:50 after start.
            requeueInterval: "30s"
            resources:
              requests:
                cpu: 10m
                memory: 96Mi   # 29/10: p95 71Mi
              limits:
                memory: 256Mi  # 03/11: same page-cache thrashing as the webhook (0.6 GB read)
          serviceMonitor:
            enabled: true
    - repoURL: git@github.com:hungkobe273/talos-gitops.git
      targetRevision: main
      path: platform/external-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      # ESO CRDs are large; client-side apply would overflow the last-applied annotation.
      - ServerSideApply=true
      # ClusterSecretStore is applied in the same sync as the CRD that defines it.
      - SkipDryRunOnMissingResource=true
