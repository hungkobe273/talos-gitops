# argocd-apps/keycloak.yaml — NHÁP. Commit 3 của chuỗi Keycloak (sau khi keycloak-db Ready).
#
# Chart: codecentric/keycloakx 7.4.0 (phát hành 14/10/2026, appVersion = Keycloak 26.8.1, image
# chính thức quay.io/keycloak/keycloak). Chọn chart thay vì Keycloak Operator theo thiết kế mục 2.1:
# không CRD lớn (bài học sự cố cert-manager 16/10), hợp mẫu multi-source đang dùng.
# Chart.yaml 7.4.0 không khai báo kubeVersion -> không có ràng buộc phiên bản K8s; vẫn cần
# `helm template` offline trên host2 trước khi commit (README bước 3).
# Nguồn: https://github.com/codecentric/helm-charts/releases , https://www.keycloak.org/downloads
#
# Namespace keycloak (PSA restricted): từ 05/11 app này tạo và giữ nhãn, thay app keycloak-db đã gỡ
# (DB nằm ở Supabase từ 23/10; manifest platform/keycloak-db chỉ còn dùng cho diễn tập khôi phục).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    # 1) Chart, values lấy từ repo này ($values).
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.4.0
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/platform/keycloak/values.yaml
    # 2) Repo này, chỉ để tham chiếu file values.
    - repoURL: git@github.com:hungkobe273/talos-gitops.git
      targetRevision: main
      ref: values
    # 3) ConfigMap realm `talos` + SealedSecrets (bootstrap admin, client secrets).
    - repoURL: git@github.com:hungkobe273/talos-gitops.git
      targetRevision: main
      path: platform/keycloak/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  # Sync tay lần đầu 21/10 09:13 (commit 2e91f9c); Ready, đăng nhập admin + Grafana SSO đạt -> bật automated 22/10.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
