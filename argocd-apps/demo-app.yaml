apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  annotations:
    # After monitoring: ServiceMonitor/PrometheusRule CRDs must exist.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:hungkobe273/talos-gitops.git
    targetRevision: main
    path: apps/demo-app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry for ~16 minutes (default ~6). Set when the cluster pulled from Harbor (10-minute replication
    # gap after each Jenkins push); kept since 09/11 (pulls straight from GHCR) for transient registry errors.
    retry:
      limit: 8
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
