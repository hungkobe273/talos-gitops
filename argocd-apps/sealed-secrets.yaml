apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Sync first: everything else depends on Secrets it decrypts.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal looks for this name by default.
        fullnameOverride: sealed-secrets-controller
        # 2026-10-22 scan: had no requests. Request ~ usage, memory limit as a runaway cap.
        resources:
          requests:
            cpu: 10m
            memory: 96Mi     # 29/10: p95 73Mi
          limits:
            memory: 160Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
