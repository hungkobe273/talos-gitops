# Kyverno: admission policies. First (and for now only) job: pods in namespace demo may
# only run talos-demo-app images that Jenkins signed with cosign (key in
# platform/cosign/cosign.pub), so an image pushed to ghcr by anyone else, or one that
# failed the pipeline's scans (those are never signed), is rejected by the API server.
#
# Kept small for this cluster's RAM: only the admission controller runs (no background,
# cleanup or reports controller), and its webhooks only see namespace demo, so a Kyverno
# outage can only block demo-app pods, never the rest of the cluster.
# Policy + ghcr pull secret (Kyverno must read signatures from the private registry):
# platform/kyverno/manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The policies.kyverno.io CRDs always showed OutOfSync with the client-side diff,
    # while `kubectl diff --server-side` found no change; compare on the server instead.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      # 12/11: 3.9.1 -> 3.9.2 (Kyverno v1.19.2, image verification fixes). Render diff: only images
      # and an optional CRD field filter. Rollback = revert this commit.
      targetRevision: 3.9.2
      helm:
        releaseName: kyverno
        valuesObject:
          admissionController:
            # 13/11: 1 -> 2. Talos upgrade of w1: the only replica was on w1, the image-signature policy is
            # failurePolicy Fail, so no demo-app pod could be created for ~6 min (demo-app down 14:18-14:35).
            # The chart's default preferred anti-affinity puts one replica per worker; the PDB keeps one
            # running during a drain. Cost: +176Mi request on the other worker (w1 60%, w2 77% on 13/11).
            replicas: 2
            podDisruptionBudget:
              enabled: true
              minAvailable: 1
            # 06/11: talos-core, must run on the surviving worker (platform/admission-policies/priority-core.yaml).
            priorityClassName: talos-core
            container:
              resources:
                requests:
                  cpu: 50m
                  memory: 176Mi    # 29/10: p95 140Mi, max 185Mi
                limits:
                  memory: 384Mi
          backgroundController:
            enabled: false
          cleanupController:
            enabled: false
          reportsController:
            enabled: false
          # Helm pre-delete hook; Argo CD does not run it, and it would linger as an orphan Job.
          webhooksCleanup:
            enabled: false
          config:
            webhooks:
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values: ["demo"]
          # Registry login used when Kyverno fetches signatures (secret in ns kyverno).
          existingImagePullSecrets:
            - ghcr-pull
    - repoURL: git@github.com:hungkobe273/talos-gitops.git
      targetRevision: main
      path: platform/kyverno/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      # Kyverno CRDs are very large: client-side apply would overflow the annotation.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
