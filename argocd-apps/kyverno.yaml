# Kyverno: admission policies. First (and for now only) job: pods in namespace demo may
# only run talos-demo-app images that Jenkins signed with cosign (key in
# platform/cosign/cosign.pub), so an image pushed to ghcr by anyone else, or one that
# failed the pipeline's scans (those are never signed), is rejected by the API server.
#
# Kept small for this cluster's RAM: only the admission controller runs (no background,
# cleanup or reports controller), and its webhooks only see namespace demo, so a Kyverno
# outage can only block demo-app pods, never the rest of the cluster.
# Policy + ghcr pull secret (Kyverno must read signatures from the private registry):
# platform/kyverno/manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The policies.kyverno.io CRDs always showed OutOfSync with the client-side diff,
    # while `kubectl diff --server-side` found no change; compare on the server instead.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valuesObject:
          admissionController:
            replicas: 1
            container:
              resources:
                requests:
                  cpu: 50m
                  memory: 176Mi    # 29/10: p95 140Mi, max 185Mi
                limits:
                  memory: 384Mi
              # Trust the internal CA (harbor.talos.internal) on top of the image's system CAs.
              # Not caCertificates.data: that replaces the system bundle and would break ghcr.io.
              extraEnvVars:
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs:/etc/talos-ca
            extraVolumes:
              - name: talos-internal-ca
                secret:
                  secretName: talos-internal-ca
            extraVolumeMounts:
              - name: talos-internal-ca
                mountPath: /etc/talos-ca
                readOnly: true
          backgroundController:
            enabled: false
          cleanupController:
            enabled: false
          reportsController:
            enabled: false
          # Helm pre-delete hook; Argo CD does not run it, and it would linger as an orphan Job.
          webhooksCleanup:
            enabled: false
          config:
            webhooks:
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values: ["demo"]
          # Registry login used when Kyverno fetches signatures (secret in ns kyverno).
          existingImagePullSecrets:
            - ghcr-pull
            - harbor-pull
    - repoURL: git@github.com:hungkobe273/talos-gitops.git
      targetRevision: main
      path: platform/kyverno/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      # Kyverno CRDs are very large: client-side apply would overflow the annotation.
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
