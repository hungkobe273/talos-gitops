# Test of shared storage nfs-host2 (05/11, TTS_QTDV/design/storage-chung-pv.md section 6). Throwaway: delete this
# file after T1-T8 (Retain: then remove /srv/nfs/k8s/storage-test on host2 by hand).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:hungkobe273/talos-gitops.git
    targetRevision: main
    path: platform/storage-test
  destination:
    server: https://kubernetes.default.svc
    namespace: storage-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
