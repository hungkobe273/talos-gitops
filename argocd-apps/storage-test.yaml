# Test of Longhorn (06/11, TTS_QTDV/design/longhorn-ha.md section 3, tests L1-L6). Throwaway: delete this file
# after the tests (Retain: then delete the released volume in the Longhorn UI). Same Postgres + T1 job as the NFS
# test of 05/11 (commit 1c34d82), only the StorageClass and the node-failure tolerations differ.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:hungkobe273/talos-gitops.git
    targetRevision: main
    path: platform/storage-test
  destination:
    server: https://kubernetes.default.svc
    namespace: storage-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
