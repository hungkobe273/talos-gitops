name: keycloak-image

# Builds the optimized Keycloak image (platform/keycloak/image/Dockerfile) and pushes it to
# ghcr.io/hungkobe273/talos-keycloak. Harbor pull-replicates it (rule ghcr-keycloak) and
# platform/keycloak/values.yaml pins the tag. Infrastructure image: not signed, Kyverno only
# checks namespace demo.
on:
  push:
    branches: [main]
    paths: ["platform/keycloak/image/**", ".github/workflows/keycloak-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hungkobe273/talos-keycloak

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Tag = Keycloak version + short commit, e.g. 26.8.1-ab12cd3 (immutable).
      - id: vars
        run: |
          v=$(sed -n 's/^FROM quay.io\/keycloak\/keycloak:\([^ ]*\) AS builder$/\1/p' platform/keycloak/image/Dockerfile)
          echo "tag=${v}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cluster nodes are amd64 only.
      - uses: docker/build-push-action@v7
        with:
          context: platform/keycloak/image
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Trivy (report only, HIGH/CRITICAL with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -e TRIVY_USERNAME=${{ github.actor }} -e TRIVY_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
            aquasec/trivy:0.76.1 image --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}"

      - run: echo "Pushed ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
