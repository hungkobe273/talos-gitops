apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
spec:
  # Pods are run by Rollout demo-app (workloadRef); this Deployment only holds the template.
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      annotations:
        # Bump to create a new revision for a blue-green test without a new image.
        demo.talos/bluegreen-test: "2"
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      # Private GHCR image: pull secret is created from a SealedSecret.
      imagePullSecrets:
        - name: ghcr-pull
      # Spread the 2 replicas over different nodes (one per worker).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 20
      containers:
        - name: demo-app
          # Tag is set by kustomization.yaml (bumped by CI).
          image: ghcr.io/hungkobe273/talos-demo-app
          ports:
            - name: http
              containerPort: 8080
          # Environment (".env") comes from Vault through External Secrets
          # (externalsecret.yaml -> Secret demo-app-env).
          envFrom:
            - secretRef:
                name: demo-app-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
