# Blue-green for demo-app. The pod template comes from Deployment demo-app
# (workloadRef), so CI still only bumps newTag in kustomization.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # Default 600 s is shorter than a cold pre-promotion analysis (ZAP image pull ~10+ min
  # on this HDD + office link): the rollout then shows Degraded although nothing failed.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
    # Git sets the Deployment to replicas: 0 itself; the controller must not
    # fight Argo CD selfHeal over it.
    scaleDown: never
  strategy:
    blueGreen:
      activeService: demo-app
      previewService: demo-app-preview
      # Promote automatically once the pre-promotion analysis passes;
      # a failed analysis aborts and keeps the current version active.
      autoPromotionEnabled: true
      prePromotionAnalysis:
        templates:
          - templateName: demo-app-smoke-load
          - templateName: demo-app-error-rate
          # DAST (OWASP ZAP baseline) on the preview, added 27/10.
          - templateName: demo-app-zap-baseline
        args:
          - name: preview-service
            value: demo-app-preview
      # Keep the old version 10 min after promotion so a git revert can still
      # switch back instantly (Argo CD polls 3-8 min on this cluster).
      scaleDownDelaySeconds: 600
