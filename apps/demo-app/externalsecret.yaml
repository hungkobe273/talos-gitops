# demo-app's ".env": every key under kv/demo/demo-app in Vault becomes one key of the
# Secret demo-app-env, which the pods load with envFrom. Git holds only this mapping;
# the values live in Vault (write them with `vault kv patch kv/demo/demo-app KEY=value`).
# ESO re-reads Vault every refreshInterval. Running pods keep their environment until
# they restart, so a changed value reaches the app with the next rollout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-env
  namespace: demo
  annotations:
    # Before the Rollout, so new pods never start without their env Secret.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: demo-app-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: demo/demo-app
