# Talos machine config patch (w1, w2, cp1): nodes resolve harbor.talos.internal (HAProxy on
# host2) and containerd trusts the internal CA for it, so pods can pull from Harbor.
# hostnames is merged by appending (dry-run 27/10), so list only the new name.
# Apply: talosctl -n <node> patch mc --patch @talos/patches/harbor-registry.yaml --mode=no-reboot
