machine:
  network:
    interfaces:
      - interface: enp1s0
        dhcp: false
        addresses:
          - 10.10.10.11/24
        routes:
          - network: 0.0.0.0/0
            gateway: 10.10.10.1
        vip:
          ip: 10.10.10.100
---
apiVersion: v1alpha1
kind: ResolverConfig
# Company DNS servers: placeholders because this repo is public. Real values are in
# ~/talos-kvm/patch-cp1.yaml on host2; fill them in before using this patch.
nameservers:
  - address: COMPANY_DNS_1
  - address: COMPANY_DNS_2
