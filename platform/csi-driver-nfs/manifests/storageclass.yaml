# NFS on host2 (10.10.10.1 = bridge talos-net, /srv/nfs/k8s). One directory per PVC: <namespace>/<pvc name>.
# Not the default class: a chart without storageClassName must not land on NFS by accident.
# Immediate binding: every on-prem worker can mount it, the PV is not tied to a node (unlike local-path).
# Retain: deleting a PVC keeps the directory on host2 (remove it by hand).
# mountOptions are not validated by Kubernetes: a typo only shows as a failed mount (pod ContainerCreating).
# hard: on an NFS outage I/O waits instead of failing (safe for Postgres); host2 starts NFS before the VMs
# and stops it after them (systemd drop-ins on libvirtd and libvirt-guests).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-host2
provisioner: nfs.csi.k8s.io
parameters:
  server: 10.10.10.1
  share: /srv/nfs/k8s
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - hard
  - noatime
