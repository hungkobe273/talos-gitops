# One store for the whole cluster: KV v2 mount "kv" in Vault, Kubernetes auth role
# "eso". ESO logs in with its own service account token; Vault checks it against the
# API server (TokenReview) and hands out a token with policy "eso-read" (read kv/*).
# Per-app isolation is by ExternalSecret namespace + path naming kv/<namespace>/<app>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # 06/11 test N-1: Vault restarted on the other worker, the store stayed InvalidProviderConfig (ESO default 0 =
  # never re-validate) and demo-app-env stopped syncing until it was nudged by hand. Re-check every 60 s.
  refreshInterval: 60
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
