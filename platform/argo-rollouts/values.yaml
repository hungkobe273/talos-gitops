# argo-rollouts chart 2.43.8 (app v1.10.1). Single HDD lab: keep it small.
installCRDs: true
keepCRDs: true
crdAnnotations:
  # Never let Argo CD prune the CRDs: deleting them deletes every Rollout.
  argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
controller:
  replicas: 1
  # Prefers w3 (30/10): needs the API and Prometheus (on w3); deploys already need Internet (Jenkins).
  tolerations:
    - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
  resources:
    requests:
      cpu: 20m
      memory: 144Mi        # 29/10: p95 116Mi
    limits:
      memory: 256Mi
  # 13/11: lease 15s/retry 2s = ~30 etcd writes/min for one replica; 42/598 slow applies on cp1 (etcd log).
  # 60/45/15 -> ~4 writes/min; failover up to 60s is fine (1 replica, deploys are rare).
  extraArgs:
    - --leader-election-lease-duration=60s
    - --leader-election-renew-deadline=45s
    - --leader-election-retry-period=15s
  metrics:
    enabled: false
dashboard:
  enabled: false
