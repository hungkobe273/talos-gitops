# Periodic CVE scan of every image running in the cluster (mentor 29/10: images are only scanned at
# build time, so a CVE published later goes unnoticed). Design: TTS_QTDV/design/de-xuat-quet-image-dinh-ky.md.
# Trivy runs as a CronJob, no RAM used between runs. Lives in ns demo to reuse Secret ghcr-pull.
# Prefers w3 (GCP worker): pulls ~44 images there instead of through the on-prem HDD; 12:30 because
# the cluster is off at night. Images behind harbor.talos.internal (unreachable from w3) are scanned
# from their ghcr.io source, same digests by replication.
# Result: one "SCAN image=... result=ok|critical|error" line per image in the log (Log tap trung
# dashboard, namespace demo). Any CRITICAL makes the Job fail, ImageScanCritical alerts on Telegram.
# Manual run: kubectl -n demo create job --from=cronjob/image-scan image-scan-manual
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-scan
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-scan-read-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-scan-read-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-scan-read-pods
subjects:
  - kind: ServiceAccount
    name: image-scan
    namespace: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-scan-scripts
  namespace: demo
data:
  list-images.py: |
    # Writes the unique images of all running pods to /shared/images.txt.
    import json, os, re, ssl, urllib.request
    sa = "/var/run/secrets/kubernetes.io/serviceaccount"
    host = os.environ["KUBERNETES_SERVICE_HOST"]
    req = urllib.request.Request(f"https://{host}/api/v1/pods?limit=1000",
                                 headers={"Authorization": "Bearer " + open(f"{sa}/token").read()})
    ctx = ssl.create_default_context(cafile=f"{sa}/ca.crt")
    pods = json.load(urllib.request.urlopen(req, context=ctx))["items"]
    images = {c["image"] for p in pods for c in p["spec"].get("containers", []) + p["spec"].get("initContainers", [])}
    images = sorted({re.sub(r"^harbor\.talos\.internal/talos/", "ghcr.io/hungkobe273/", i) for i in images})
    open("/shared/images.txt", "w").write("\n".join(images) + "\n")
    print(f"{len(images)} images")
  scan.sh: |
    #!/bin/sh
    # One failed pull must not hide the other results: only CRITICAL (exit 10) fails the Job.
    trivy image --download-db-only --no-progress --cache-dir /cache || exit 2
    critical=0
    while read -r img; do
      trivy image --skip-db-update --no-progress --quiet --cache-dir /cache --platform linux/amd64 \
        --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 10 --timeout 10m "$img"
      rc=$?
      case $rc in
        0) r=ok ;;
        10) r=critical; critical=$((critical + 1)) ;;
        *) r=error ;;
      esac
      echo "SCAN image=$img result=$r"
    done < /shared/images.txt
    echo "SCAN done critical_images=$critical"
    [ "$critical" -eq 0 ]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-scan
  namespace: demo
spec:
  schedule: "30 12 * * 1-5"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3000
      template:
        spec:
          serviceAccountName: image-scan
          restartPolicy: Never
          tolerations:
            - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
          # Go resolver: DNS over TCP, UDP from w3 to CoreDNS on-prem loses ~1% of packets.
          dnsConfig:
            options:
              - name: use-vc
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: ["w3"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: list-images
              image: python:3.13.7-alpine3.22
              command: ["python", "/scripts/list-images.py"]
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
          containers:
            - name: trivy
              image: aquasec/trivy:0.76.1
              command: ["sh", "/scripts/scan.sh"]
              env:
                - {name: DOCKER_CONFIG, value: /docker}
                - {name: TMPDIR, value: /cache}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1536Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: scripts, mountPath: /scripts}
                - {name: shared, mountPath: /shared}
                - {name: cache, mountPath: /cache}
                - {name: ghcr, mountPath: /docker}
          volumes:
            - name: scripts
              configMap: {name: image-scan-scripts}
            - name: shared
              emptyDir: {}
            - name: cache
              emptyDir: {sizeLimit: 15Gi}
            - name: ghcr
              secret:
                secretName: ghcr-pull
                items:
                  - {key: .dockerconfigjson, path: config.json}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: image-scan
  namespace: demo
spec:
  groups:
    - name: image-scan
      rules:
        - alert: ImageScanCritical
          expr: kube_job_status_failed{namespace="demo",job_name=~"image-scan-.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Image đang chạy có CVE CRITICAL hoặc job quét lỗi ({{ $labels.job_name }})"
            description: "Xem dashboard Log tập trung, namespace demo, tìm: SCAN result=critical"
