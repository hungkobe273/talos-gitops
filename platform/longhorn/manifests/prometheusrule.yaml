# Alert rules for Longhorn (10/11). Before this, a volume with one replica left (degraded) or no usable replica
# (faulted) only showed in the Longhorn UI. kps picks up every PrometheusRule (ruleSelector {}), Alertmanager routes
# all alerts to Telegram. Metrics come from the longhorn-manager ServiceMonitor (values.yaml metrics.serviceMonitor);
# robustness/status series are 1 for the current state, 0 for the others.
# Timings from the 10/11 tests: N-1 test (w1 power cut) -> degraded until the replica was rebuilt 4:26 after w1 came
# back; cold start after an unclean shutdown -> faulted for about 1 minute, then reattached.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  groups:
    - name: longhorn
      rules:
        # No usable replica: the pod using the volume cannot start. for 5m skips the short faulted window of a
        # cold start after an unclean shutdown.
        - alert: LonghornVolumeFaulted
          expr: max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="faulted"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} faulted for 5 minutes"
            description: "No usable replica. kubectl -n longhorn-system get volumes.longhorn.io {{ $labels.volume }}; kubectl -n longhorn-system get replicas.longhorn.io | grep {{ $labels.volume }}"
        # One of the 2 replicas is gone: data still served but one more failure loses it. A worker down already
        # alerts through the watchdog; this also catches a replica that fails while both nodes look fine.
        # for 20m: rebuilding after a worker comes back took ~4.5 min (10/11).
        - alert: LonghornVolumeDegraded
          expr: max by (pvc_namespace, pvc, volume) (longhorn_volume_robustness{state="degraded"}) == 1
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has only 1 healthy replica for 20 minutes"
            description: "Check that w1 and w2 are Ready and the Longhorn node is schedulable; rebuild: kubectl -n longhorn-system get replicas.longhorn.io | grep {{ $labels.volume }}. While degraded, losing the other worker loses this volume."
        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn node {{ $labels.node }} not ready for 10 minutes"
            description: "kubectl -n longhorn-system get nodes.longhorn.io; kubectl -n longhorn-system get pod -o wide | grep {{ $labels.node }}"
        # Each worker has a 20 GB Longhorn disk (vdb); replicas grow with snapshots.
        - alert: LonghornDiskAlmostFull
          expr: longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.8
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk on {{ $labels.node }} is {{ $value | humanizePercentage }} full"
            description: "kubectl -n longhorn-system get snapshots.longhorn.io; delete old snapshots, or grow vdb (Talos UserVolumeConfig longhorn)."
