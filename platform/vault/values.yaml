# Values for hashicorp/vault 0.34.1 (Vault 2.0.4). See argocd-apps/vault.yaml for the why.
global:
  enabled: true
  # TLS inside the cluster is off for the lab (traffic stays on the pod network).
  # Production: tls_disable = 0 with a cert-manager certificate.
  tlsDisable: true

injector:
  enabled: false

csi:
  enabled: false

ui:
  enabled: true

server:
  # 06/11: talos-core, above pinned (priority-core.yaml). updateStrategy OnDelete: takes effect at the next restart.
  # 10/11: data + audit on Longhorn (2 replicas, w1 and w2), Vault no longer pinned to w2.
  # Design: TTS_QTDV/design/vault-longhorn.md.
  priorityClassName: talos-core
  # Request ~ expected usage, memory limit as a runaway cap (cluster has little spare RAM).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi        # 29/10: p95 175Mi, max 378Mi lúc khởi động
    limits:
      memory: 512Mi

  # No node preference since 10/11 (Longhorn attaches on w1 or w2); chart default pod anti-affinity applies.

  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn

  auditStorage:
    enabled: true
    size: 1Gi
    storageClass: longhorn

  # LAN access for the UI (login with Keycloak, platform/vault/oidc.sh): HAProxy on kvm-host2 -> Traefik
  # -> Service vault-active. TLS from the internal CA ends at Traefik; Traefik -> Vault is plain HTTP
  # inside the pod network (global.tlsDisable). No paths = "/" (UI under /ui, API under /v1).
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: talos-internal-ca
    activeService: true
    hosts:
      - host: vault.talos.internal
    tls:
      - secretName: vault-tls
        hosts:
          - vault.talos.internal

  # KMS service-account key, mounted at /vault/userconfig/vault-kms/credentials.json.
  extraVolumes:
    - type: secret
      name: vault-kms

  standalone:
    enabled: false

  ha:
    enabled: true
    # 10/11: was 0 while the data was copied to the Longhorn PVCs (design/vault-longhorn.md).
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"
        }

        seal "gcpckms" {
          credentials = "/vault/userconfig/vault-kms/credentials.json"
          project     = "project-df6719af-b37c-4a54-b3b"
          region      = "asia-southeast1"
          key_ring    = "talos-vault"
          crypto_key  = "vault-unseal"
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

        service_registration "kubernetes" {}
    disruptionBudget:
      enabled: false

# Metrics (listener telemetry block above allows unauthenticated /v1/sys/metrics) and alerts,
# routed to Telegram by the shared Alertmanager route like every other rule.
serverTelemetry:
  serviceMonitor:
    enabled: true
    interval: 30s
  prometheusRules:
    enabled: true
    rules:
      - alert: VaultSealed
        # After a restart the KMS auto-unseal takes seconds; 5 minutes sealed means KMS or
        # its credentials are broken, and apps cannot refresh their secrets.
        expr: vault_core_unsealed == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Vault {{ $labels.pod }} is sealed"
          description: "Check GCP KMS access (SealedSecret vault-kms, roles on key talos-vault/vault-unseal) and vault-0 logs."
      - alert: VaultDown
        expr: absent(vault_core_unsealed)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No Vault metrics for 10 minutes"
          description: "vault-0 is not running or not scraped (namespace vault)."
