# Vault not ready = sealed or not serving. Its readiness probe (vault status) fails while
# sealed; auto-unseal needs GCP KMS, so the usual cause is host2 without Internet (portal
# login expired), as on 28/10 morning. While sealed, ESO cannot refresh any app .env.
# Telegram via the shared Alertmanager route.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vault
  namespace: vault
spec:
  groups:
    - name: vault
      rules:
        - alert: VaultNotReady
          expr: kube_pod_container_status_ready{namespace="vault", container="vault"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Vault {{ $labels.pod }} not ready for 10 minutes (sealed?)"
            description: "kubectl -n vault exec vault-0 -- vault status; if Sealed=true check host2 Internet/portal (KMS auto-unseal), then kubectl -n vault logs vault-0 --tail=30."
