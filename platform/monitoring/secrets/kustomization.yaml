# SealedSecrets for the monitoring namespace. Encrypted with the cluster's
# Sealed Secrets public key; only the controller in the cluster can decrypt.
# Plus the public internal CA (ConfigMap, not a secret) used by Grafana OIDC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - telegram-bot-sealed.yaml
  - grafana-admin-sealed.yaml
  - grafana-oidc-sealed.yaml
  - talos-internal-ca-configmap.yaml
