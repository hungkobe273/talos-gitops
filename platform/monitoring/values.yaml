# kube-prometheus-stack 92.2.0 — slim profile for the Talos lab.
# Telegram bot token never appears here: it comes from the Secret
# "telegram-bot" (key bot-token), created from a SealedSecret.

# Talos runs etcd, scheduler, controller-manager and kube-proxy with metrics
# bound to 127.0.0.1, so Prometheus cannot scrape them. Disable the scrapes and
# their rules instead of living with permanent "...Down" alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
windowsMonitoring:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false
    # 03/11: group kube-apiserver-slos = only the 4 KubeAPIErrorBudgetBurn alerts, which fire every day:
    # the error budget (1d/3d windows) is eaten by /readyz, /livez and pod creates answering 500 while
    # the API boots at each cold start (207 + 14 + 32 in the 6 h with 4 cold starts on 03/11; 0 errors
    # in the 30 min after). The cluster is off every night, so the SLO math does not fit. API down is
    # still covered by KubeAPIDown and the watchdog. (defaultRules.disabled left the group empty,
    # and an empty PrometheusRule group is rejected.)
    kubeApiserverSlos: false

prometheus:
  prometheusSpec:
    # On w3 (GCP worker over KubeSpan, 30/10, docs/ke-hoach-w3-gcp.md): frees 752Mi on w1 (97%).
    # Scrapes by pod IP and discovers targets via the API (TCP), so the KubeSpan path is enough.
    # w3 stops at 17:15 with its GCP schedule: if the cluster stays up overnight, Prometheus is
    # down after that (pause the watchdog). Until 30/10 it was pinned to w1 (old PV deleted 03/11).
    # Required, because local-path creates the PV on whatever node the pod lands on first.
    # The chart's default podAntiAffinity "soft" would override affinity, so off.
    podAntiAffinity: ""
    tolerations:
      - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: ["w3"]
    # ~350 MB/day at ~2.6k samples/s (23/10); whichever limit is hit first wins.
    retention: 7d
    retentionSize: 3GB
    # TSDB on a local-path-retain PVC (survives restarts; PV pinned to w3).
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from every
    # namespace, not only the ones labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 704Mi      # 29/10: p95 7 ngày 623Mi (trước 400Mi)
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    # Next to Prometheus on w3 (30/10); preferred, so it returns on-prem when w3 is off. Without Internet
    # Telegram is unreachable anyway. DNS over TCP (use-vc): UDP from w3 loses ~1% on the company uplink.
    # The chart's default podAntiAffinity "soft" overrides affinity, so switch it off (1 replica anyway).
    podAntiAffinity: ""
    dnsConfig:
      options:
        - name: use-vc
    tolerations:
      - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
    # Mounted at /etc/alertmanager/secrets/telegram-bot/
    secrets:
      - telegram-bot
    resources:
      requests:
        cpu: 10m
        memory: 64Mi       # 29/10: p95 52Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog always fires (proves the pipeline is alive); keep it out of chat.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    inhibit_rules:
      # Keycloak NotReady (often DB/Internet) also trips KeycloakDown: send only one message.
      - source_matchers:
          - alertname = "KeycloakNotReady"
        target_matchers:
          - alertname = "KeycloakDown"
        equal: [namespace]
      # 03/11: the image-scan Job fails on purpose when an image has a CRITICAL CVE (ImageScanCritical
      # reads kube_job_status_failed), so the generic KubeJobFailed for the same Job is a duplicate.
      - source_matchers:
          - alertname = "ImageScanCritical"
        target_matchers:
          - alertname = "KubeJobFailed"
        equal: [namespace, job_name]
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/telegram-bot/bot-token
            chat_id: -5324289007
            send_resolved: true
            parse_mode: HTML
            message: |-
              [Alertmanager] {{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} ({{ .Alerts | len }})
              {{ range .Alerts }}<b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
              {{ with .Labels.namespace }}ns={{ . }} {{ end }}{{ with .Labels.pod }}pod={{ . }} {{ end }}{{ with .Labels.node }}node={{ . }}{{ end }}
              {{ with .Annotations.summary }}{{ . | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}{{ else }}{{ .Annotations.description | reReplaceAll "&" "&amp;" | reReplaceAll "<" "&lt;" | reReplaceAll ">" "&gt;" }}{{ end }}
              {{ end }}
    templates: []

grafana:
  # 06/11: no priorityClassName (priority 0). Grafana is no longer pinned to w2 (PV on Longhorn below), so it is a
  # low-tier pod that waits when a worker is lost (TTS_QTDV/design/ram-khi-mat-mot-worker.md); was talos-pinned.
  # Datasource for central logs (platform/victoria-logs/manifests/grafana-datasource.yaml, 30/10).
  # Downloaded from grafana.com at pod start; without Internet Grafana starts without it.
  plugins:
    - victoriametrics-logs-datasource
  # Grafana DB (SQLite) on a PV (K7, 2026-10-22, design/grafana-pvc.md): keeps Keycloak-login users and
  # skips the ~813 migrations on every new pod. Keep deploymentStrategy Recreate (only one process may open
  # grafana.db, and the Longhorn volume is ReadWriteOnce).
  # 06/11: PVC grafana-longhorn (platform/monitoring/manifests/grafana-pvc-longhorn.yaml), copied from the old
  # local-path PVC kps-grafana (md5 of grafana.db equal, 595 files). Faster fsync for the 49 s dashboard
  # provisioning at cold start, and Grafana can run on w1 or w2 (no more nodeAffinity to w2). Old PVC kps-grafana
  # kept with Prune=false and no Argo CD tracking until ~13/11. Roll back: drop existingClaim, restore
  # storageClassName local-path-retain + the w2 nodeAffinity (git revert of this commit).
  persistence:
    enabled: true
    type: pvc
    existingClaim: grafana-longhorn
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  # Admin user/password come from a SealedSecret, not from values.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    TELEGRAM_BOT_TOKEN:
      secretKeyRef:
        name: telegram-bot
        key: bot-token
    # Keycloak client secret for [auth.generic_oauth]; GF_<SECTION>_<KEY> overrides grafana.ini.
    # Secret "grafana-oidc" comes from platform/monitoring/secrets/grafana-oidc-sealed.yaml.
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc
        key: client-secret
  env:
    # Force Go's own DNS resolver. Talos host DNS answers AAAA for keycloak.talos.internal
    # with NXDOMAIN (only an IPv4 StaticHostConfig exists); musl/libc getaddrinfo then fails the
    # whole lookup (seen 2026-10-21 with curl), while the Go resolver keeps the A record.
    GODEBUG: netdns=go
  # Public internal CA, so Grafana trusts https://keycloak.talos.internal (tls_client_ca below).
  extraConfigmapMounts:
    - name: talos-internal-ca
      configMap: talos-internal-ca
      mountPath: /etc/grafana/talos-ca
      readOnly: true
  resources:
    requests:
      cpu: 20m
      memory: 704Mi        # 29/10: p95 7 ngày 608Mi (trước 384Mi); OOM-kill trên w2 sáng 29/10
    limits:
      memory: 1536Mi
  # 29/10: every container gets a memory request (ValidatingAdmissionPolicy require-memory-request).
  # Sidecars max 7 days: grafana-sc-dashboard 90Mi, grafana-sc-datasources 86Mi.
  # 12/11 (audit sec2): the chart ClusterRole always grants configmaps+secrets cluster-wide when a sidecar is on,
  # whatever sidecar.*.resource says, so the Grafana SA could read every Secret. Chart RBAC off; a configmaps-only
  # ClusterRole with a new name is in manifests/grafana-sidecar-rbac.yaml (new name: roleRef is immutable).
  # No Secret carries grafana_dashboard/grafana_datasource labels (checked 12/11), so nothing is lost.
  rbac:
    create: false
  sidecar:
    dashboards:
      resource: configmap
    datasources:
      resource: configmap
    # 10/11: pinned 2.14.3 (chart default 2.14.1 had certifi GHSA-6q48-6c7w-9gw2 CRITICAL in image-scan,
    # TTS_QTDV/design/cve-con-lai-10-11.md). 2.14.3 is a rebuild on Python 3.14.10; check the next image-scan.
    image:
      tag: 2.14.3
    resources:
      requests:
        cpu: 5m
        memory: 96Mi
      limits:
        memory: 192Mi
  initChownData:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 64Mi
  # First start on the HDD runs hundreds of SQLite migrations (DB lives in an
  # emptyDir); give it 5 minutes before the liveness probe may restart it.
  livenessProbe:
    initialDelaySeconds: 300
  # Grafana Alerting, provisioned as code. ${TELEGRAM_BOT_TOKEN} is expanded
  # by Grafana from the env var above at start-up.
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: telegram
          receivers:
            - uid: telegram-group
              type: telegram
              settings:
                bottoken: ${TELEGRAM_BOT_TOKEN}
                chatid: "-5324289007"
                # No custom message: the chart renders these files through
                # Helm tpl, which would try to evaluate Grafana's {{ }} templates.
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: telegram
          group_by: [grafana_folder, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: demo-app
          folder: Demo App
          interval: 1m
          rules:
            - uid: demo-app-p95-latency
              title: DemoAppSlowP95
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    refId: A
                    instant: true
                    expr: histogram_quantile(0.95, sum by (le) (rate(demo_http_request_duration_seconds_bucket{namespace="demo", route="GET /api/work"}[5m])))
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator:
                          type: gt
                          params: [0.5]
              for: 2m
              noDataState: OK
              execErrState: Error
              labels:
                severity: warning
              annotations:
                summary: demo-app p95 latency of /api/work above 500ms for 2 minutes
  # LAN access: HAProxy on kvm-host2 -> Traefik -> this Ingress. TLS from the internal CA.
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: talos-internal-ca
    hosts:
      - grafana.talos.internal
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.talos.internal
  # Anonymous read-only access (decided by the mentor 2026-10-16). Network access is limited
  # by the HAProxy ACL on kvm-host2; the admin account still signs in normally.
  grafana.ini:
    server:
      root_url: https://grafana.talos.internal/
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    # SSO via Keycloak realm "talos" (client "grafana"). The local admin login form stays as
    # the fallback when Keycloak is down (no disable_login_form, no auto_login).
    # The browser uses auth_url; the Grafana pod itself calls token_url/api_url, which needs
    # keycloak.talos.internal to resolve in-cluster (StaticHostConfig, 2026-10-21).
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      # client_secret: from env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (Secret grafana-oidc)
      # No "groups" scope: the groups mapper sits on the client itself; Keycloak rejects unknown scopes.
      scopes: openid email profile
      auth_url: https://keycloak.talos.internal/realms/talos/protocol/openid-connect/auth
      token_url: https://keycloak.talos.internal/realms/talos/protocol/openid-connect/token
      api_url: https://keycloak.talos.internal/realms/talos/protocol/openid-connect/userinfo
      use_pkce: true
      login_attribute_path: preferred_username
      email_attribute_path: email
      name_attribute_path: name
      # talos-admins -> Admin, anyone else who can sign in (talos-viewers) -> Viewer.
      role_attribute_path: "contains(groups[*], 'talos-admins') && 'Admin' || 'Viewer'"
      role_attribute_strict: false
      tls_client_ca: /etc/grafana/talos-ca/ca.crt
    auth:
      # Also end the Keycloak session when signing out of Grafana.
      signout_redirect_url: https://keycloak.talos.internal/realms/talos/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.talos.internal%2Flogin&client_id=grafana
    # 03/11: plugin loading took 40.6 s of the cold start (Grafana is the last pod to turn Ready).
    # Datasources in use: prometheus, alertmanager, victoriametrics-logs-datasource. These plugins
    # have no datasource here and cost ~30 s; most start their own backend binary from the HDD.
    # To use one again, remove it from this list.
    # 06/11 cold start: grafana-metricsdrilldown-app took ~11 s of the 25 s plugin load and is not used.
    plugins:
      disable_plugins: "grafana-metricsdrilldown-app,grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-pyroscope-app,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin"
  # A cold start on the HDD (SQLite migrations, plugin registration) can take >10 min;
  # give it up to 20 min before liveness checks start, and never run two Grafanas at once.
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    timeoutSeconds: 10
    # 5 min: grafana.db is on a PVC since 2026-10-22, restarts take 26 s - 2.5 min (was 120 = 20 min for 813 migrations).
    failureThreshold: 30
  # Switching the live Deployment from RollingUpdate needed a one-off kubectl patch of
  # spec.strategy to {type: Recreate}: the defaulted rollingUpdate block made the apply invalid.
  deploymentStrategy:
    type: Recreate

# Requests/limits for the small components (2026-10-22 scan, working set max 1h: operator 25Mi,
# kube-state-metrics 28Mi, node-exporter ~30Mi). Request ~ usage, memory limit ~4x, no CPU limit.
prometheusOperator:
  # Prefers w3 (GCP worker, 30/10): stateless, needs only the API (and GitHub); back on-prem when w3 is off.
  tolerations:
    - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
  # Helm hook Jobs admission-create/-patch (cert for the operator webhook), seconds per sync.
  # Without a request they trip ValidatingAdmissionPolicy require-memory-request (30/10).
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 128Mi        # 29/10: p95 101Mi
    limits:
      memory: 192Mi
  # config-reloader sidecar + init in the Prometheus and Alertmanager pods (max 7 days 43Mi).
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 5m
        memory: 48Mi
      limits:
        memory: 96Mi
kube-state-metrics:
  # Prefers w3 (GCP worker, 30/10): stateless, needs only the API (and GitHub); back on-prem when w3 is off.
  tolerations:
    - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
  resources:
    requests:
      cpu: 10m
      memory: 96Mi         # 29/10: p95 78Mi
    limits:
      memory: 192Mi
prometheus-node-exporter:
  # 06/11: DaemonSet, must not be a preemption victim (recreated on the same node anyway; see velero nodeAgent).
  priorityClassName: system-node-critical
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
