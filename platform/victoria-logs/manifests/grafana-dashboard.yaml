# Dashboard "Log tập trung": overview only. Searching logs moved to vmui
# (https://logs.talos.internal/select/vmui/, behind oauth2-proxy; mentor 05/11: "truy vấn theo giao diện
# của nó là chuẩn nhất"), so the free-text box and the log list are gone; the link opens vmui.
# Loaded by the kps Grafana sidecar (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: victorialogs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  log-tap-trung.json: |
    {
      "uid": "log-tap-trung",
      "title": "Log tập trung",
      "tags": ["logs", "victorialogs"],
      "timezone": "browser",
      "refresh": "1m",
      "time": {"from": "now-1h", "to": "now"},
      "schemaVersion": 39,
      "links": [
        {"title": "Tra log (vmui)", "type": "link", "url": "https://logs.talos.internal/select/vmui/", "targetBlank": true, "icon": "external link"}
      ],
      "templating": {
        "list": [
          {"name": "namespace", "label": "Namespace", "type": "textbox", "query": "demo", "current": {"text": "demo", "value": "demo"}}
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Số dòng log theo pod ($namespace)",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 8},
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"},
          "targets": [
            {"refId": "A", "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"},
             "queryType": "statsRange", "step": "1m",
             "expr": "k8s.namespace.name:\"$namespace\" | stats by (k8s.pod.name) count() lines"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Dòng có chữ error theo namespace (cả cụm)",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"},
          "targets": [
            {"refId": "A", "datasource": {"type": "victoriametrics-logs-datasource", "uid": "victorialogs"},
             "queryType": "statsRange", "step": "5m",
             "expr": "error | stats by (k8s.namespace.name) count() lines"}
          ]
        }
      ]
    }
