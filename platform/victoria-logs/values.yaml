server:
  # Without a unit retentionPeriod is in months.
  retentionPeriod: 7d
  extraArgs:
    retention.maxDiskSpaceUsageBytes: 4GiB
  persistentVolume:
    enabled: true
    storageClassName: local-path-retain
    size: 5Gi
  # On w3 (GCP worker over KubeSpan, plan docs/ke-hoach-w3-gcp.md, 30/10): frees w2. local-path PV
  # sticks to w3; logs before the move stay on the old PV on w2 (Retain).
  priorityClassName: talos-pinned
  tolerations:
    - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["w3"]
  resources:
    requests: {cpu: 20m, memory: 96Mi}    # 30/10: p95 43Mi, max 50Mi (grows with data)
    limits: {memory: 512Mi}
