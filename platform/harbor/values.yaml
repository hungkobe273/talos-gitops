# Values for goharbor/harbor chart 1.19.2 (Harbor 2.15.2). See argocd-apps/harbor.yaml.
externalURL: https://harbor.talos.internal

# Trust the internal CA (Keycloak OIDC at https://keycloak.talos.internal).
caBundleSecretName: talos-internal-ca

expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    secret:
      secretName: harbor-tls
  ingress:
    className: traefik
    controller: default
    hosts:
      core: harbor.talos.internal
    annotations:
      cert-manager.io/cluster-issuer: talos-internal-ca

# Every internal secret comes from SealedSecret harbor/harbor-secrets
# (platform/harbor/make-secrets.sh); nothing is generated by Helm, so Argo CD syncs
# never rotate them, and no password is in Git.
existingSecretAdminPassword: harbor-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secrets

persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry:
      storageClass: local-path-retain
      size: 10Gi
    jobservice:
      jobLog:
        storageClass: local-path-retain
        size: 1Gi
    redis:
      storageClass: local-path-retain
      size: 1Gi

# All Harbor pods on w2 (most free memory), so the PVCs sit together on one node.
portal:
  nodeSelector: {kubernetes.io/hostname: talos-iv6-z5m}
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
core:
  nodeSelector: {kubernetes.io/hostname: talos-iv6-z5m}
  existingSecret: harbor-secrets
  existingXsrfSecret: harbor-secrets
  existingXsrfSecretKey: CSRF_KEY
  # Token-signing key pair, from SealedSecret harbor-token-cert (stable across syncs).
  secretName: harbor-token-cert
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
jobservice:
  nodeSelector: {kubernetes.io/hostname: talos-iv6-z5m}
  existingSecret: harbor-secrets
  existingSecretKey: JOBSERVICE_SECRET
  resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
registry:
  nodeSelector: {kubernetes.io/hostname: talos-iv6-z5m}
  existingSecret: harbor-secrets
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    username: harbor_registry_user
    existingSecret: harbor-secrets
  registry:
    resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
  controller:
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}

# Images are scanned by Trivy in the Jenkins pipeline already; no second copy here.
trivy:
  enabled: false

# The chart's internal database only takes a plain-text password in values, so Harbor
# uses its own PostgreSQL (platform/harbor/manifests/postgres.yaml) as an "external"
# database, password from harbor-secrets (key: password).
database:
  type: external
  external:
    host: harbor-postgres.harbor.svc
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-secrets
    sslmode: disable

redis:
  type: internal
  internal:
    nodeSelector: {kubernetes.io/hostname: talos-iv6-z5m}
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
exporter:
  nodeSelector: {kubernetes.io/hostname: talos-iv6-z5m}
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
