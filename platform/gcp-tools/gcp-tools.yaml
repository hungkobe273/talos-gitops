# Jenkins, GitLab CE and SonarQube run on GCP VMs and listen only on 127.0.0.1 there.
# host2 keeps SSH tunnels to them (host2/systemd/gcp-tunnel-*.service) listening on 10.10.10.1,
# the host side of the VM network. A small nginx pod forwards to those ports (Argo CD does not
# manage EndpointSlices, so a selector-less Service is not an option), and each tool gets an
# Ingress with an internal-CA certificate: it opens like every other *.talos.internal tool
# (LAN only, HAProxy IP allow-list). Login stays SAML via Keycloak.
apiVersion: v1
kind: Namespace
metadata:
  name: gcp-tools
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tunnel-proxy
  namespace: gcp-tools
data:
  default.conf: |
    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_buffering off;
      server {
        listen 8080;
        location / {
          proxy_pass http://10.10.10.1:18080;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Port 443;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 300s;
        }
      }
      server {
        listen 8081;
        location / {
          proxy_pass http://10.10.10.1:18081;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Port 443;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 300s;
        }
      }
      server {
        listen 8082;
        location / {
          proxy_pass http://10.10.10.1:19000;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Port 443;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 300s;
        }
      }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-proxy
  namespace: gcp-tools
spec:
  replicas: 1
  selector:
    matchLabels: {app: tunnel-proxy}
  template:
    metadata:
      labels: {app: tunnel-proxy}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27.3-alpine
          ports:
            - name: jenkins
              containerPort: 8080
            - name: gitlab
              containerPort: 8081
            - name: sonarqube
              containerPort: 8082
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: tunnel-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: gcp-tools
spec:
  selector: {app: tunnel-proxy}
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: gcp-tools
  annotations:
    cert-manager.io/cluster-issuer: talos-internal-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - jenkins.talos.internal
      secretName: jenkins-tls
  rules:
    - host: jenkins.talos.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  name: http
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gcp-tools
spec:
  selector: {app: tunnel-proxy}
  ports:
    - name: http
      port: 80
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gcp-tools
  annotations:
    cert-manager.io/cluster-issuer: talos-internal-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gitlab.talos.internal
      secretName: gitlab-tls
  rules:
    - host: gitlab.talos.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  name: http
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: gcp-tools
spec:
  selector: {app: tunnel-proxy}
  ports:
    - name: http
      port: 80
      targetPort: 8082
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube
  namespace: gcp-tools
  annotations:
    cert-manager.io/cluster-issuer: talos-internal-ca
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sonarqube.talos.internal
      secretName: sonarqube-tls
  rules:
    - host: sonarqube.talos.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarqube
                port:
                  name: http
