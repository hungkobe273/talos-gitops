# Backup of Kubernetes objects to GCS (bucket talos-kvm-velero-vtc). Design: TTS_QTDV/design/velero-dien-tap-khoi-phuc.md
# PV data: local-path PVs are hostPath, Velero FSB does not support them. From 06/11 Longhorn PVs can be backed up
# file by file (node-agent + kopia, same bucket and SA): opt-in per backup (--default-volumes-to-fs-backup) or per
# pod annotation backup.velero.io/backup-volumes. Test L6 in TTS_QTDV/design/longhorn-ha.md.
image:
  repository: docker.io/velero/velero
  tag: v1.18.4
initContainers:
  - name: velero-plugin-for-gcp
    image: docker.io/velero/velero-plugin-for-gcp:v1.14.4
    imagePullPolicy: IfNotPresent
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 64Mi}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
    volumeMounts:
      - {mountPath: /target, name: plugins}
upgradeCRDs: false
cleanUpCRDs: false
snapshotsEnabled: false
# node-agent DaemonSet: reads pod volumes under /var/lib/kubelet/pods (hostPath, runs as root), so the velero
# namespace is PSA privileged (argocd-apps/velero.yaml). No tolerations: w1/w2 only, where Longhorn volumes live.
# Chart has no default requests; kopia needs memory while uploading, the limit keeps it from starving a worker.
deployNodeAgent: true
nodeAgent:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 512Mi}
credentials:
  useSecret: true
  existingSecret: velero-gcs
configuration:
  backupStorageLocation:
    - name: default
      provider: gcp
      bucket: talos-kvm-velero-vtc
      prefix: talos-kvm
      default: true
      accessMode: ReadWrite
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
# Image USER is a name (cnb), runAsNonRoot needs a numeric uid.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: ["ALL"]}
  readOnlyRootFilesystem: true
# Kopia writes its repository config under /udmrepo and its cache under $HOME/.cache (HOME is / for uid 65532).
# With a read-only root filesystem the first file-system backups failed (06/11, "mkdir /udmrepo" then "mkdir /.cache:
# read-only file system"), so both get a writable emptyDir; everything there is rebuilt from the bucket on restart.
extraVolumes:
  - name: udmrepo
    emptyDir: {sizeLimit: 1Gi}
extraVolumeMounts:
  - name: udmrepo
    mountPath: /udmrepo
    subPath: config
  - name: udmrepo
    mountPath: /.cache
    subPath: cache
# Prefers w3 like other control loops; only talks to the API server and GCS.
tolerations:
  - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
metrics:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
    spec:
      - alert: VeleroBackupFailed
        expr: increase(velero_backup_failure_total{schedule!=""}[2h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Velero backup failed, schedule {{ $labels.schedule }}"
      - alert: VeleroNoRecentBackup
        expr: time() - velero_backup_last_successful_timestamp{schedule!=""} > 60 * 60 * 80
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "No successful Velero backup for over 80 hours, schedule {{ $labels.schedule }}"
schedules:
  daily:
    disabled: false
    schedule: "30 2 * * 1-5"       # 09:30 VN (UTC+7): T2/T4 the cluster stops at 10:30, w3 is up
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h
      storageLocation: default
      includedNamespaces: ["*"]
      excludedNamespaces: [kube-node-lease, kube-public]
      excludedResources:
        - events
        - events.events.k8s.io
        - pods
        - replicasets.apps
        - endpoints
        - endpointslices.discovery.k8s.io
        - ephemeralreports.reports.kyverno.io
        - clusterephemeralreports.reports.kyverno.io
        - policyreports.wgpolicyk8s.io
        - clusterpolicyreports.wgpolicyk8s.io
        - certificaterequests.cert-manager.io
        - orders.acme.cert-manager.io
        - challenges.acme.cert-manager.io
      snapshotVolumes: false
