# Copy of demo/harbor-pull (Harbor robot talos+demo-pull, pull only) for Kyverno, which
# reads cosign signatures from harbor.talos.internal with it (ImageValidatingPolicy
# credentials.secrets). Re-seal from demo/harbor-pull if the robot is recreated.
# Generated from the live Secret, piped straight into kubeseal (see runbook 3.17).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-pull
  namespace: kyverno
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: harbor-pull
      namespace: kyverno
    type: kubernetes.io/dockerconfigjson
