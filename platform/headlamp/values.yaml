# Headlamp web UI. Reached through Traefik Ingress (headlamp.talos.internal) or kubectl port-forward.
fullnameOverride: headlamp

# The chart's default binds Headlamp's own ServiceAccount to cluster-admin.
# Headlamp forwards each user's own token to the API server, so the pod
# itself needs no rights. Login accounts live in platform/headlamp/rbac.
clusterRoleBinding:
  create: false

# Required by the namespace's "restricted" Pod Security Standard.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  privileged: false
  runAsUser: 100
  runAsGroup: 101
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 96Mi           # 29/10: p95 79Mi
  limits:
    memory: 192Mi

# Default 1s probe timeout is too tight on the HDD-backed nodes.
probes:
  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5

# LAN access: HAProxy on kvm-host2 -> Traefik -> this Ingress. TLS from the internal CA.
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: talos-internal-ca
  hosts:
    - host: headlamp.talos.internal
      paths:
        - path: /
          type: Prefix
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.talos.internal

# OIDC login via Keycloak (design/headlamp-oidc.md). Needs the KubeAuthenticationConfig jwt block on cp1
# (~/talos-kvm/patch-authn-oidc.yaml); token login with the headlamp-viewer/admin SAs keeps working.
config:
  oidc:
    secret:
      create: false              # client id/secret/issuer/scopes come from SealedSecret S6 (rbac/headlamp-oidc-sealed.yaml)
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true
    callbackURL: https://headlamp.talos.internal/oidc-callback   # makes the chart add -oidc-callback-url
    usePKCE: true                # client headlamp requires PKCE S256
env:
  - name: OIDC_CALLBACK_URL      # externalSecret mode does not set these two itself
    value: https://headlamp.talos.internal/oidc-callback
  - name: OIDC_USE_PKCE
    value: "true"
  - name: SSL_CERT_FILE          # trust talos-internal-ca when calling Keycloak
    value: /etc/headlamp-ca/ca.crt
  - name: GODEBUG                # AAAA NXDOMAIN workaround, as for Grafana (runbook 3.12)
    value: netdns=go
volumes:
  - name: talos-internal-ca
    configMap:
      name: talos-internal-ca
volumeMounts:
  - name: talos-internal-ca
    mountPath: /etc/headlamp-ca
    readOnly: true
