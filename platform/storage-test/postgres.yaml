# T1: Postgres on a nfs-host2 PVC. Test data only, so POSTGRES_HOST_AUTH_METHOD=trust instead of a password
# (no secret in this public repo); reachable only inside the cluster, removed after the test.
# Runs as uid 999 (PSA restricted); fsGroup 999 lets kubelet hand the NFS directory to postgres.
apiVersion: v1
kind: Service
metadata:
  name: pg
spec:
  clusterIP: None
  selector: {app: pg}
  ports:
    - {name: pg, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg
spec:
  serviceName: pg
  replicas: 1
  selector:
    matchLabels: {app: pg}
  template:
    metadata:
      labels: {app: pg}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6
          env:
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: nfs-host2
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
