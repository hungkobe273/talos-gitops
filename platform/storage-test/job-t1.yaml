# T1: write 10 000 rows once, then print the reference values (count, md5) to the log.
# Read the result: vmui or dashboard "Log tập trung", namespace storage-test, search "T1".
# Later checks (T2 delete pod, T3 move node) re-run the SELECT and must print the same md5.
apiVersion: batch/v1
kind: Job
metadata:
  name: t1-write
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psql
          image: docker.io/library/postgres:18.6
          env:
            - {name: PGHOST, value: pg-0.pg}
            - {name: PGUSER, value: postgres}
          command:
            - sh
            - -c
            - |
              until pg_isready -q; do echo "T1 waiting for pg-0"; sleep 5; done
              psql -v ON_ERROR_STOP=1 -q <<'SQL'
              CREATE TABLE IF NOT EXISTS t (id serial PRIMARY KEY, v text, ts timestamptz DEFAULT now());
              INSERT INTO t (v) SELECT md5(i::text) FROM generate_series(1, 10000) i WHERE NOT EXISTS (SELECT 1 FROM t);
              SQL
              psql -At -c "SELECT 'T1 count=' || count(*) || ' md5=' || md5(string_agg(v, '' ORDER BY id)) FROM t"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
