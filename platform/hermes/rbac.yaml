# Read-only access for Hermes Agent on host2 (docs/de-xuat-hermes-agent.md, 16/11).
# The agent sends command output to a cloud LLM, so this role never reads Secrets or ConfigMaps
# and cannot change anything. host2 builds its kubeconfig from the token below (token is not in git).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-readonly
  namespace: hermes
automountServiceAccountToken: false
---
# Long-lived token for an agent outside the cluster. Rotate: delete the Secret, Argo CD recreates it.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-readonly-token
  namespace: hermes
  annotations:
    kubernetes.io/service-account.name: hermes-readonly
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, events, services, endpoints, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, rollouts]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [volumes, nodes, replicas, engines]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, clustersecretstores, secretstores]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-readonly
subjects:
  - kind: ServiceAccount
    name: hermes-readonly
    namespace: hermes
