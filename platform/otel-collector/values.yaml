mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  # hostPath /var/log/pods + filelog receiver; skip the collector's own logs (no loop).
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # namespace / pod / container attributes on every line (creates its ClusterRole).
  kubernetesAttributes:
    enabled: true
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
# 30/10 after cold start the collector printed nothing and was killed by liveness (30s) in a loop.
# Give it up to 5 min to start before liveness applies; debug logs to see where startup waits.
startupProbe:
  httpGet: {path: /, port: 13133}
  periodSeconds: 10
  failureThreshold: 30
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 192Mi}
config:
  processors:
    memory_limiter: {check_interval: 5s, limit_mib: 150, spike_limit_mib: 32}
  exporters:
    otlphttp/vl:
      logs_endpoint: http://vl-victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
      headers:
        VL-Stream-Fields: k8s.namespace.name,k8s.pod.name,k8s.container.name
  service:
    telemetry:
      logs: {level: debug}
    pipelines:
      logs:
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/vl]
      # The chart enables traces/metrics pipelines with a debug exporter by default.
      traces: null
      metrics: null
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
