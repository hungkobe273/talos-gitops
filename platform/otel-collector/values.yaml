mode: daemonset
image:
  # k8s distribution (filelog, k8sattributes, otlphttp): the contrib binary (~300 MB) did not fit
  # the 192Mi limit as page cache, so after cold start it thrashed the HDD in state D (30/10).
  repository: otel/opentelemetry-collector-k8s
presets:
  # hostPath /var/log/pods + filelog receiver; skip the collector's own logs (no loop).
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # namespace / pod / container attributes on every line (creates its ClusterRole).
  kubernetesAttributes:
    enabled: true
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  # w3 (GCP worker, 30/10): collect its pod logs too.
  - key: cloud
    operator: Exists
    effect: NoSchedule
# Startup can be slow while the HDD is busy at cold start: up to 5 min before liveness applies.
startupProbe:
  httpGet: {path: /, port: 13133}
  periodSeconds: 10
  failureThreshold: 30
# One collector per node must always fit: at cold start w2 fills up and a plain DaemonSet pod stays Pending (30/10).
priorityClassName: system-node-critical
resources:
  requests: {cpu: 20m, memory: 64Mi}
  # 03/11: working set at 82% of 256Mi (binary page cache counts), room so it never thrashes like on 30/10.
  limits: {memory: 384Mi}
config:
  processors:
    memory_limiter: {check_interval: 5s, limit_mib: 150, spike_limit_mib: 32}
    # 05/11 (TTS_QTDV/design/log-truong-json.md): JSON log lines become fields at ingest, so
    # VictoriaLogs can filter and aggregate by key (status:500 | stats by (route) ...) without
    # unpack_json. Only namespaces listed here; one expression, since lines in conditions are ORed.
    # error_mode ignore: a line that fails to parse is sent unchanged, never dropped.
    transform/parse:
      error_mode: ignore
      log_statements:
        - context: log
          conditions:
            - resource.attributes["k8s.namespace.name"] == "demo" and IsString(body) and IsMatch(body, "^\\{")
          statements:
            - merge_maps(attributes, ParseJSON(body), "insert")
            - set(body, attributes["msg"]) where attributes["msg"] != nil
            - set(severity_text, ToUpperCase(attributes["level"])) where attributes["level"] != nil
            - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
            - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
            - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
            - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
            - delete_matching_keys(attributes, "^(msg|level|time)$")
  exporters:
    otlphttp/vl:
      logs_endpoint: http://vl-victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
      headers:
        VL-Stream-Fields: k8s.namespace.name,k8s.pod.name,k8s.container.name
  service:
    pipelines:
      logs:
        processors: [memory_limiter, k8sattributes, transform/parse, batch]
        exporters: [otlphttp/vl]
      # The chart enables traces/metrics pipelines with a debug exporter by default.
      traces: null
      metrics: null
ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
