# Copy of demo/ghcr-pull (GHCR read token) so Keycloak pulls ghcr.io/hungkobe273/talos-keycloak directly
# (09/11, Harbor removed: docs/ke-hoach-bo-harbor.md). Generated from the live Secret, piped straight into
# kubeseal; re-seal from demo/ghcr-pull when the token is rotated.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: keycloak
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: keycloak
    type: kubernetes.io/dockerconfigjson
