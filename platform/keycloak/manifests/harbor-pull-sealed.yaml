# Copy of demo/harbor-pull (Harbor robot talos+demo-pull, pull only on project talos) so
# Keycloak can pull the optimized image harbor.talos.internal/talos/talos-keycloak.
# Re-seal from demo/harbor-pull if the robot is recreated (runbook 3.17).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-pull
  namespace: keycloak
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: harbor-pull
      namespace: keycloak
    type: kubernetes.io/dockerconfigjson
