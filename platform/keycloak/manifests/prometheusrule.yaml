# Alert rules for Keycloak (2026-10-22, design/keycloak-monitoring.md). kps picks up every PrometheusRule
# (ruleSelector {}); Alertmanager routes all alerts to Telegram. Applied after the ServiceMonitor had up == 1,
# otherwise absent() would fire.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: keycloak
  namespace: keycloak
spec:
  groups:
    - name: keycloak
      rules:
        # for 5m: a cold start takes 1-2.5 min plus dbchecker waiting for keycloak-db; 1m would fire on every restart.
        - alert: KeycloakDown
          expr: |
            sum(up{namespace="keycloak", service="keycloak-http"}) == 0
              or absent(up{namespace="keycloak", service="keycloak-http"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Keycloak has no healthy target
            description: Prometheus cannot scrape Keycloak (keycloak-http:9000/metrics) for 5 minutes. SSO login for Grafana/Argo CD is down; local admin and anonymous Grafana still work.
        # DB is external (Supabase). Keycloak readiness includes the DB check, so NotReady = DB/Internet/Keycloak problem.
        - alert: KeycloakNotReady
          expr: |
            kube_statefulset_status_replicas_ready{namespace="keycloak", statefulset="keycloak"} < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Keycloak is not ready (DB on Supabase unreachable?)
            description: keycloak-0 not Ready for 5 minutes. Readiness checks the DB (Supabase via session pooler). Check host2 Internet/captive portal first, then Supabase project status (paused after 7 days idle), then keycloak-0 logs. Local admin for Grafana/Argo CD still works.
