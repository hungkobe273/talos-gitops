# Rebalance pods after a cold start: the first worker to become Ready
# takes every Pending pod (incident 20/10: 21 pods on w2, 1 on w1).
kind: CronJob
schedule: "*/10 * * * *"
startingDeadlineSeconds: 300
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1
# Chart default is system-cluster-critical; not needed here.
priorityClassName: ""
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
deschedulerPolicy:
  # Only the two on-prem workers: cp1 and w3 are tainted and cannot take ordinary pods.
  nodeSelector: "!node-role.kubernetes.io/control-plane,topology.kubernetes.io/zone!=gcp-asia-southeast1-b"
  # Few evictions per run so the HDD is not flooded with restarts.
  maxNoOfPodsToEvictPerNode: 5
  maxNoOfPodsToEvictTotal: 5
  profiles:
    - name: balance
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              # Grafana/Prometheus use emptyDir; allow moving them.
              defaultDisabled:
                - "PodsWithLocalStorage"
              extraEnabled:
                - "PodsWithPVC"
        - name: RemoveDuplicates
        - name: LowNodeUtilization
          args:
            # % of allocatable, by requests. A node is underutilized only when ALL
            # three are below thresholds. 30/10 cold start: w1 30/40/8, w2 40/97/24
            # (old 20/20/10 never matched w1, nothing moved). Balanced ~68% memory
            # sits between the two bands, so nothing moves once spread.
            thresholds:
              cpu: 60
              memory: 55
              pods: 40
            targetThresholds:
              cpu: 85
              memory: 75
              pods: 60
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - LowNodeUtilization
