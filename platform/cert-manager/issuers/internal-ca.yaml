# Internal CA for the lab. The private key is generated by cert-manager and only lives in
# Secret cert-manager/talos-internal-ca (never in Git). Only ca.crt is shared with browsers.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: talos-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: talos-kvm internal CA
  subject:
    organizations: [talos-kvm lab]
  secretName: talos-internal-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: talos-internal-ca
spec:
  ca:
    secretName: talos-internal-ca
