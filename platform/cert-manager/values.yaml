# cert-manager for the internal CA (talos-internal-ca). CRDs are managed by the chart and kept on uninstall.
crds:
  enabled: true
  keep: true
resources:
  requests: {cpu: 10m, memory: 128Mi}   # 29/10: p95 100Mi
  limits: {memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 80Mi}    # 29/10: p95 71Mi
    # 06/11 cold start: read 576 MB from the HDD with a ~50 MB binary: at 128Mi its page cache was evicted again and
    # again (same as external-secrets on 03/11). Limit only, the request (scheduling) is unchanged.
    limits: {memory: 256Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 112Mi}   # 29/10: p95 85Mi, max 120Mi
    limits: {memory: 256Mi}
startupapicheck:
  enabled: false
# 06/11: talos-core (platform/admission-policies/priority-core.yaml): must run on the surviving worker when one is lost.
global:
  priorityClassName: talos-core
