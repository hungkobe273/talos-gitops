# cert-manager for the internal CA (talos-internal-ca). CRDs are managed by the chart and kept on uninstall.
crds:
  enabled: true
  keep: true
resources:
  requests: {cpu: 10m, memory: 128Mi}   # 29/10: p95 100Mi
  limits: {memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 80Mi}    # 29/10: p95 71Mi
    limits: {memory: 128Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 112Mi}   # 29/10: p95 85Mi, max 120Mi
    limits: {memory: 256Mi}
startupapicheck:
  enabled: false
