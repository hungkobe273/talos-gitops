# Settings shared by both oauth2-proxy instances (env form of the flags, OAUTH2_PROXY_<config name>).
# Docs: https://oauth2-proxy.github.io/oauth2-proxy/configuration/providers/keycloak_oidc
# Pods read it only at start: after a change bump the config-rev annotation in prometheus.yaml/alertmanager.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-common
data:
  OAUTH2_PROXY_PROVIDER: keycloak-oidc
  OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
  OAUTH2_PROXY_OIDC_ISSUER_URL: https://keycloak.talos.internal/realms/talos
  OAUTH2_PROXY_CLIENT_ID: oauth2-proxy
  OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
  # keycloak-oidc asks for "openid email profile groups" by default; realm talos has no "groups" client
  # scope (the groups mapper sits on the client itself) -> Keycloak answers invalid_scope. Same as Argo CD.
  OAUTH2_PROXY_SCOPE: openid email profile
  # Only group talos-admins (groups claim, short names: mapper full.path=false). Anyone else gets 403.
  OAUTH2_PROXY_ALLOWED_GROUPS: talos-admins
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  # keycloak.talos.internal has a cert from the internal CA (ConfigMap talos-internal-ca).
  OAUTH2_PROXY_PROVIDER_CA_FILES: /etc/talos-ca/ca.crt
  OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
  # Behind Traefik (X-Forwarded-*), TLS ends at Traefik.
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  # Trust X-Forwarded-* only from the pod network (Traefik is a pod), same as KC_PROXY_TRUSTED_ADDRESSES.
  OAUTH2_PROXY_TRUSTED_PROXY_IPS: 10.244.0.0/16
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_EXPIRE: 8h
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
