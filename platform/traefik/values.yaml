# Ingress controller behind HAProxy on kvm-host2 (192.168.136.38:80/443 -> NodePort 30080/30443 on w1/w2).
deployment:
  replicas: 2
# 06/11: was ScheduleAnyway, and after the talos-core rollout both replicas sat on w2 (one node down = no ingress).
# DoNotSchedule keeps them on different workers; nodeTaintsPolicy Honor leaves cp1/w3 (tainted) and a NotReady
# node out of the count, so a rolling update (3rd pod) and a lost worker still schedule.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    # Count only pods of the same ReplicaSet, so the new pods of a rolling update spread among themselves.
    matchLabelKeys: [pod-template-hash]
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
service:
  spec:
    type: NodePort
ports:
  web:
    nodePort: 30080
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    nodePort: 30443
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    # NodePort Service has no LB address to copy; publish the HAProxy entry IP instead so
    # Ingress status (and Argo CD health) is set.
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: 192.168.136.38
ingressClass:
  enabled: true
  isDefaultClass: true
resources:
  requests: {cpu: 50m, memory: 224Mi}   # 29/10: p95 189Mi (trước 64Mi)
  limits: {memory: 384Mi}
# 06/11: talos-core (platform/admission-policies/priority-core.yaml): must run on the surviving worker when one is lost.
priorityClassName: talos-core
