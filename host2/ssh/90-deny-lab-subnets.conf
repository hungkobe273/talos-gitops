# /etc/ssh/sshd_config.d/90-deny-lab-subnets.conf  (12/11, audit C1)
# Pod va node on-prem (mang VM 10.10.10.0/24, mang pod 10.244.0.0/16; Flannel --ip-masq nen pod hien IP node)
# toi thang duoc cong 22 cua host2 qua virbr-talos. 30 ngay qua khong co lan dang nhap nao tu hai dai nay.
# Ten 90- de Match nam sau moi file khac trong sshd_config.d. Kiem truoc khi reload:
#   sshd -T -C addr=10.10.10.21,user=ngochung,host=x | grep denyusers  -> "denyusers *"
#   sshd -T -C voi IP may cua minh: giong het truoc khi cai, tru permitrootlogin
Match Address 10.10.10.0/24,10.244.0.0/16
    DenyUsers *
