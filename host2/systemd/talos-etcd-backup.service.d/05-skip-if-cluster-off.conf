# Bo qua (khong bao loi) khi cp1 khong chay, vd timer 16:45 luc cum da tat bang talos-cluster-stop.sh.
# Truoc 12/11 nhung lan nay bao Failed len Telegram giong het lan loi that (03/11, 06/11), nen khong phan biet duoc.
# ExecCondition tra 1 -> unit "skipped", khong chay ExecStart, khong goi OnFailure, khong cham dau backup.
# "$$" la cach viet "$" trong file unit (systemd tu thay bien $NAME).
# Bo: xoa file nay roi systemctl daemon-reload.
[Service]
ExecCondition=/bin/sh -c '[ "$$(/usr/bin/virsh -c qemu:///system domstate cp1 2>/dev/null)" = running ]'
