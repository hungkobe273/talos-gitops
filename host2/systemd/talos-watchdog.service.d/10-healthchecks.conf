# /etc/systemd/system/talos-watchdog.service.d/10-healthchecks.conf
# GIAI DOAN 2 (tuy chon, can Hung/mentor dong y dung dich vu ngoai healthchecks.io).
# Chi them drop-in nay SAU KHI da tao file /etc/talos-watchdog/hc-ping-url (root 600, 1 dong
# https://hc-ping.com/<uuid>). Thieu file thi LoadCredential lam unit loi khi khoi dong.
# Ping URL la bi mat (ai co URL deu ping gia duoc) -> khong ghi vao Git/chat.
[Service]
LoadCredential=hc-ping-url:/etc/talos-watchdog/hc-ping-url
