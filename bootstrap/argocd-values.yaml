# argo-cd chart 10.10.1 (Argo CD v3.5.4) — installed by hand with Helm (D10, checked 2026-10-22:
# release "argocd" rev 1, no Application manages it, live values == this file). Change = edit, commit, then:
#   helm upgrade argocd argo-cd --repo https://argoproj.github.io/argo-helm \
#     --version 10.10.1 -n argocd -f bootstrap/argocd-values.yaml
# Slim: no Dex (OIDC goes straight to Keycloak) and no notifications controller.
dex:
  enabled: false
notifications:
  enabled: false

# LAN access (K6, 2026-10-22): HAProxy on kvm-host2 -> Traefik -> this Ingress, TLS from the internal CA.
# global.domain also sets url: https://argocd.talos.internal in argocd-cm (needed for OIDC redirects).
global:
  domain: argocd.talos.internal

configs:
  params:
    # Traefik terminates TLS; argocd-server speaks plain HTTP behind it (Ingress then targets port 80).
    server.insecure: true

  # SSO via Keycloak realm "talos" (2026-10-22). Local "admin" stays enabled as the fallback.
  # clientSecret comes from Secret argocd-oidc-keycloak (SealedSecret S5, bootstrap/), label part-of=argocd.
  # No "groups" in requestedScopes: the groups mapper sits on the argocd client itself.
  cm:
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.talos.internal/realms/talos
      clientID: argocd
      clientSecret: $argocd-oidc-keycloak:clientSecret
      requestedScopes: ["openid", "profile", "email"]
      # Log out also ends the Keycloak session; Argo CD sends post_logout_redirect_uri=https://argocd.talos.internal
      logoutURL: https://keycloak.talos.internal/realms/talos/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}
      rootCA: |
        -----BEGIN CERTIFICATE-----
        MIIBszCCAVqgAwIBAgIUA3ct+b3dSfmubNulaFMfmnDkqy0wCgYIKoZIzj0EAwIw
        ODEWMBQGA1UEChMNdGFsb3Mta3ZtIGxhYjEeMBwGA1UEAxMVdGFsb3Mta3ZtIGlu
        dGVybmFsIENBMB4XDTI2MTAxNjA2NTEzMFoXDTM2MTAxMzA2NTEzMFowODEWMBQG
        A1UEChMNdGFsb3Mta3ZtIGxhYjEeMBwGA1UEAxMVdGFsb3Mta3ZtIGludGVybmFs
        IENBMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEFhBc+Hg7EIQTx6fVJt7jNI2f
        pu4t0dqTi+baV3FI7SZk3SX2BunJzcT/19HNZAy5ocSQ9tLAb7hQwzBgEM6EsKNC
        MEAwDgYDVR0PAQH/BAQDAgKkMA8GA1UdEwEB/wQFMAMBAf8wHQYDVR0OBBYEFK7d
        doDbcrQa85E+qWM7TKvs736sMAoGCCqGSM49BAMCA0cAMEQCIGbITibE6zNQTJIO
        zuYI5WWKK0KnbJdzQK/3F7VgA8bKAiAWbUqh9WEXPOKVa3XDhs+ata9Vwlt9qDOE
        v5YPJ9ilyQ==
        -----END CERTIFICATE-----

  # Keycloak groups claim -> Argo CD built-in roles; users in no group see nothing.
  rbac:
    policy.default: ""
    scopes: "[groups]"
    policy.csv: |
      g, talos-admins, role:admin
      g, talos-viewers, role:readonly

# Requests/limits (2026-10-22 scan): working set max 1h controller 459Mi, repo 82Mi, server 42Mi,
# appset 34Mi, redis 19Mi. Request ~ usage so the scheduler sees it; limit ~2x as a runaway cap. No CPU limit.
server:
  resources:
    requests:
      cpu: 20m
      memory: 224Mi        # 29/10: p95 7 ngày 196Mi
    limits:
      memory: 384Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: talos-internal-ca
    # TLS Secret name is fixed by the chart: argocd-server-tls (cert-manager creates it).
    tls: true

# Metrics for kps Prometheus (2026-10-22, design/argocd-followup.md c): Service + ServiceMonitor only, pods unchanged.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 768Mi        # 29/10: p95 7 ngày 662Mi, max 857Mi
    limits:
      memory: 1280Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    # Alerts -> Telegram via the common Alertmanager route. OutOfSync gets 30m: auto-sync and CI commits settle within minutes.
    rules:
      enabled: true
      spec:
        - alert: ArgoAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Argo CD app {{ $labels.name }} is Degraded
            description: Application {{ $labels.name }} has been Degraded for 15 minutes.
        - alert: ArgoAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Argo CD app {{ $labels.name }} is OutOfSync
            description: Application {{ $labels.name }} has been OutOfSync for 30 minutes (auto-sync failing or a manual change).
repoServer:
  # Prefers w3 (GCP worker, 30/10): stateless, needs only the API (and GitHub); back on-prem when w3 is off.
  tolerations:
    - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
  # DNS over TCP from w3 (UDP loses ~1% on the company uplink); Go resolver honours use-vc.
  dnsConfig:
    options:
      - name: use-vc
  resources:
    requests:
      cpu: 50m
      memory: 176Mi        # 29/10: p95 153Mi
    limits:
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
applicationSet:
  # Prefers w3 (GCP worker, 30/10): stateless, needs only the API (and GitHub); back on-prem when w3 is off.
  tolerations:
    - {key: cloud, operator: Equal, value: gcp, effect: NoSchedule}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: ["w3"]}
  # DNS over TCP from w3 (UDP loses ~1% on the company uplink); Go resolver honours use-vc.
  dnsConfig:
    options:
      - name: use-vc
  resources:
    requests:
      cpu: 10m
      memory: 112Mi        # 29/10: p95 89Mi
    limits:
      memory: 256Mi
redis:
  resources:
    requests:
      cpu: 10m
      memory: 80Mi         # 29/10: p95 67Mi
    limits:
      memory: 128Mi
